                                        <div>
                                            <div class="flex justify-between items-center mb-3">
                                                <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${c.level === 'Beginner' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20'}">${c.level}</span>${passed ? '<span class="text-xs bg-cyan-500/10 text-cyan-400 px-2.5 py-1 rounded-lg font-bold border border-cyan-500/20"><i class="fa-solid fa-check mr-1"></i> Passed (' + score + '%)</span>' : '<span class="text-xs text-slate-500">In Progress</span>'}
                                            </div>
                                            <h4 class="text-lg font-bold text-white mb-2">${c.title}</h4>
                                            <p class="text-xs text-slate-400 line-clamp-2 mb-4">${c.description}</p>
                                        </div>
                                        <button onclick="navigate('course-detail', '${c.id}')" class="w-full bg-slate-800 hover:bg-cyan-500 hover:text-darkBg text-cyan-400 border border-cyan-500/30 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                                            <span>Open Course</span>
                                            <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- COURSES LIST VIEW ---
        function renderCoursesList() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-black text-white">All 11 Required Courses</h2>
                        <button onclick="navigate('dashboard')" class="text-xs text-slate-400 hover:text-cyan-400">&larr; Back to Dashboard</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${coursesData.map(c => `
                            <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold text-cyan-400">${c.level} Level</span>
                                        <span class="text-xs text-slate-500">20-Q Final Exam Included</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-white mb-2">${c.title}</h3>
                                    <p class="text-sm text-slate-400 mb-4">${c.description}</p>
                                </div>
                                <button onclick="navigate('course-detail', '${c.id}')" class="bg-cyan-500 hover:bg-cyan-400 text-darkBg font-bold py-2.5 px-4 rounded-xl text-xs transition">
                                    Start Learning Course
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- COURSE DETAIL VIEW ---
        function renderCourseDetail(courseId) {
            const course = coursesData.find(c => c.id === courseId);
            if (!course) return `<div class="p-8 text-center text-red-400">Course not found.</div>`;

            const passed = appState.passedCourses[course.id];
            const score = appState.examScores[course.id];

            return `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <button onclick="navigate('dashboard')" class="text-xs text-cyan-400 hover:underline font-semibold">&larr; Back to Dashboard</button>
                    
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-8 shadow-xl space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="bg-cyan-500/10 text-cyan-400 text-xs font-bold px-3 py-1 rounded-full border border-cyan-500/20">${course.level}</span>
                            ${passed ? '<span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/20"><i class="fa-solid fa-trophy mr-1"></i> Passed (' + score + '%)</span>' : ''}
                        </div>
                        <h2 class="text-3xl font-black text-white">${course.title}</h2>
                        <p class="text-slate-300 text-sm md:text-base leading-relaxed">${course.description}</p>
                    </div>

                    <!-- Modules & Lessons -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-white">Course Curriculum & Lessons</h3>
                        ${course.modules.map((m, mIdx) => `
                            <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-4">
                                <h4 class="text-lg font-bold text-cyan-400">${m.title}</h4>
                                <div class="space-y-2">
                                    ${m.lessons.map((l, lIdx) => `
                                        <div class="flex justify-between items-center p-3 bg-slate-900/60 border border-slate-800 rounded-xl hover:border-cyan-500/40 transition">
                                            <div class="flex items-center space-x-3">
                                                <i class="fa-solid fa-file-lines text-cyan-400"></i>
                                                <span class="text-sm font-medium text-slate-200">${l.title}</span>
                                            </div>
                                            <button onclick="navigate('lesson', {courseId: '${course.id}', lessonIdx: ${lIdx}})" class="bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500 hover:text-darkBg border border-cyan-500/20 px-4 py-1.5 rounded-lg text-xs font-bold transition">
                                                Read Notes
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Final Exam Section -->
                    <div class="bg-gradient-to-r from-cardBg to-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl text-center space-y-4">
                        <h3 class="text-xl font-bold text-white">Course Final Examination</h3>
                        <p class="text-xs text-slate-400 max-w-md mx-auto">This examination contains exactly 20 scored questions. You must score strictly greater than 50% to pass and complete the course.</p>
                        <button onclick="navigate('exam', '${course.id}')" class="bg-cyan-500 hover:bg-cyan-400 text-darkBg font-bold px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20">
                            Start 20-Question Final Exam
                        </button>
                    </div>
                </div>
            `;
        }

        // --- LESSON READER VIEW ---
        function renderLesson(courseId, lessonIdx) {
            const course = coursesData.find(c => c.id === courseId);
            if (!course) return `<div class="p-8 text-center text-red-400">Course not found.</div>`;
            const lesson = course.modules[0].lessons[lessonIdx] || course.modules[0].lessons[0];

            return `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <button onclick="navigate('course-detail', '${course.id}')" class="text-xs text-cyan-400 hover:underline font-semibold">&larr; Back to Course Overview</button>
                    
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-8 shadow-xl space-y-6">
                        <div class="border-b border-slate-800 pb-4">
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${course.title}</span>
                            <h2 class="text-2xl font-black text-white mt-1">${lesson.title}</h2>
                        </div>
                        
                        <div class="prose prose-invert max-w-none space-y-4 text-slate-300 text-sm md:text-base leading-relaxed">
                            ${lesson.notes}
                        </div>

                        <div class="border-t border-slate-800 pt-6 flex justify-between items-center">
                            <button onclick="navigate('course-detail', '${course.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold">
                                &larr; Return to Course
                            </button>
                            <button onclick="navigate('exam', '${course.id}')" class="bg-cyan-500 hover:bg-cyan-400 text-darkBg px-6 py-2 rounded-xl text-xs font-bold shadow-lg shadow-cyan-500/20">
                                Take Final Exam &rarr;
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- EXAM VIEW (20 QUESTIONS) ---
        let currentExamState = {
            courseId: null,
            questions: [],
            userAnswers: {},
            currentIndex: 0
        };

        function renderExam(courseId) {
            const course = coursesData.find(c => c.id === courseId);
            if (!course) return `<div class="p-8 text-center text-red-400">Course not found.</div>`;

            currentExamState.courseId = course.id;
            currentExamState.questions = course.examQuestions;
            currentExamState.userAnswers = {};
            currentExamState.currentIndex = 0;

            return renderExamQuestion();
        }

        function renderExamQuestion() {
            const course = coursesData.find(c => c.id === currentExamState.courseId);
            const idx = currentExamState.currentIndex;
            const q = currentExamState.questions[idx];
            const total = currentExamState.questions.length;

            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="flex justify-between items-center bg-cardBg border border-slate-800 p-4 rounded-2xl">
                        <span class="text-xs font-bold text-cyan-400">${course.title} Final Exam</span>
                        <span class="text-xs text-slate-400">Question ${idx + 1} of ${total}</span>
                    </div>

                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-8 shadow-xl space-y-6">
                        <h3 class="text-lg font-bold text-white">${q.q}</h3>
                        
                        <div class="space-y-3">
                            ${q.options.map((opt, oIdx) => `
                                <label class="flex items-center space-x-3 p-4 bg-slate-900 border ${currentExamState.userAnswers[idx] === oIdx ? 'border-cyan-400 bg-cyan-500/10' : 'border-slate-800'} rounded-xl cursor-pointer hover:border-slate-700 transition">
                                    <input type="radio" name="question_${idx}" value="${oIdx}" ${currentExamState.userAnswers[idx] === oIdx ? 'checked' : ''} onchange="selectAnswer(${idx},${oIdx})" class="text-cyan-500 focus:ring-cyan-500 h-4 w-4 bg-slate-800 border-slate-700">
                                    <span class="text-sm text-slate-200">${opt}</span>
                                </label>
                            `).join('')}
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-slate-800">
                            <button onclick="prevExamQuestion()" ${idx === 0 ? 'disabled class="opacity-50 cursor-not-allowed bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold text-slate-400"' : 'class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold text-slate-300"'}>
                                &larr; Previous
                            </button>
                            ${idx < total - 1 ? `
                                <button onclick="nextExamQuestion()" class="bg-cyan-500 hover:bg-cyan-400 text-darkBg px-6 py-2 rounded-xl text-xs font-bold">
                                    Next &rarr;
                                </button>
                            ` : `
                                <button onclick="submitExam()" class="bg-emerald-500 hover:bg-emerald-400 text-darkBg px-6 py-2 rounded-xl text-xs font-bold shadow-lg shadow-emerald-500/20">
                                    Submit Exam
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectAnswer(qIdx, optIdx) {
            currentExamState.userAnswers[qIdx] = optIdx;
        }

        function nextExamQuestion() {
            if (currentExamState.currentIndex < currentExamState.questions.length - 1) {
                currentExamState.currentIndex++;
                document.getElementById('main-content').innerHTML = renderExamQuestion();
            }
        }

        function prevExamQuestion() {
            if (currentExamState.currentIndex > 0) {
                currentExamState.currentIndex--;
                document.getElementById('main-content').innerHTML = renderExamQuestion();
            }
        }

        function submitExam() {
            let correctCount = 0;
            const total = currentExamState.questions.length;

            currentExamState.questions.forEach((q, idx) => {
                if (currentExamState.userAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });

            const percentage = Math.round((correctCount / total) * 100);
            const passed = percentage > 50; // Strictly greater than 50%

            appState.examScores[currentExamState.courseId] = percentage;
            if (passed) {
                appState.passedCourses[currentExamState.courseId] = true;
            }
            saveState();

            navigate('result', {
                courseId: currentExamState.courseId,
                score: percentage,
                correctCount,
                total,
                passed
            });
        }

        // --- RESULTS PAGE VIEW ---
        function renderResult(param) {
            const course = coursesData.find(c => c.id === param.courseId);

            return `
                <div class="max-w-2xl mx-auto space-y-6 text-center animate-fadeIn">
                    <div class="bg-cardBg border ${param.passed ? 'border-cyan-500/40 shadow-cyan-500/10' : 'border-red-500/40 shadow-red-500/10'} rounded-2xl p-8 shadow-xl space-y-6">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full ${param.passed ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'} text-3xl font-bold">
                            <i class="fa-solid ${param.passed ? 'fa-check' : 'fa-xmark'}"></i>
                        </div>
                        
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider ${param.passed ? 'text-cyan-400' : 'text-red-400'}">${param.passed ? 'Examination Passed Successfully' : 'Examination Not Passed'}</span>
                            <h2 class="text-3xl font-black text-white mt-1">${course.title}</h2>
                        </div>

                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 grid grid-cols-3 gap-4 text-center">
                            <div>
                                <div class="text-2xl font-black text-white">${param.score}%</div>
                                <div class="text-xs text-slate-400 uppercase">Your Score</div>
                            </div>
                            <div>
                                <div class="text-2xl font-black text-cyan-400">51%</div>
                                <div class="text-xs text-slate-400 uppercase">Passing Mark</div>
                            </div>
                            <div>
                                <div class="text-2xl font-black text-white">${param.correctCount}/${param.total}</div>
                                <div class="text-xs text-slate-400 uppercase">Correct</div>
                            </div>
                        </div>

                        <p class="text-sm text-slate-300">
                            ${param.passed ? 'Congratulations! You have successfully met the rigorous passing threshold (strictly greater than 50%) and completed this course.' : 'You scored 50% or less, which does not meet the passing threshold. Review the lesson notes thoroughly and try again.'}
                        </p>

                        <div class="flex flex-col md:flex-row justify-center space-y-3 md:space-y-0 md:space-x-4 pt-4">
                            <button onclick="navigate('course-detail', '${course.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-6 py-3 rounded-xl text-xs transition">
                                Review Course Notes
                            </button>
                            <button onclick="navigate('exam', '${course.id}')" class="bg-cyan-500 hover:bg-cyan-400 text-darkBg font-bold px-6 py-3 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20">
                                Retake Examination
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PROGRESS VIEW ---
        function renderProgress() {
            const passedCount = Object.keys(appState.passedCourses).length;
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-black text-white">Your Learning Progress</h2>
                        <button onclick="navigate('dashboard')" class="text-xs text-cyan-400 hover:underline">&larr; Dashboard</button>
                    </div>

                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <span class="text-sm text-slate-400">Total Courses Passed</span>
                            <span class="text-lg font-bold text-cyan-400">${passedCount} / ${coursesData.length}</span>
                        </div>

                        <div class="space-y-4">
                            ${coursesData.map(c => {
                                const passed = appState.passedCourses[c.id];
                                const score = appState.examScores[c.id];
                                return `
                                    <div class="flex justify-between items-center p-4 bg-slate-900 border border-slate-800 rounded-xl">
                                        <div>
                                            <h4 class="text-sm font-bold text-white">${c.title}</h4>
                                            <span class="text-xs text-slate-400">${c.level} Level</span>
                                        </div>
                                        <div>
                                            ${passed ? '<span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3 py-1 rounded-lg text-xs font-bold">Passed (' + score + '%)</span>' : '<span class="text-xs text-slate-500">Not Passed</span>'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Initial App Load
        window.onload = () => {
            navigate('dashboard');
        };
    </script>
</body>
</html>
