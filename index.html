                                <div class="space-y-2">

                                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">${course.category}</span>
                                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">${course.level}</span>
                                    </div>
                                    <h1 class="text-3xl font-extrabold text-white">${course.title}</h1>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                ${examButtonState}
                            </div>
                        </div>
                        <p class="text-slate-300 leading-relaxed">${course.description}</p>
                        
                        <!-- Progress Bar -->
                        <div class="space-y-2 pt-4 border-t border-slate-800">
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-400">Course Learning Progress</span>
                                <span class="text-cyan-400 font-semibold">${completedLessonsCount} / ${totalLessons} Lessons Completed (${progressPercent}%)</span>
                            </div>
                            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                                <div class="bg-gradient-to-r from-cyan-500 to-violet-500 h-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Learning Objectives -->
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-4">
                        <h3 class="text-lg font-bold text-white flex items-center"><i class="fa-solid fa-bullseye text-cyan-400 mr-2"></i> Learning Objectives</h3>
                        <ul class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-slate-300">
            `;

            course.objectives.forEach(obj => {
                html += `<li class="flex items-start space-x-2"><i class="fa-solid fa-check text-cyan-400 mt-1"></i><span>${obj}</span></li>`;
            });

            html += `</ul></div>`;

            // Modules & Lessons List
            html += `<div class="space-y-6"><h3 class="text-2xl font-bold text-white">Course Modules & Lessons</h3>`;

            course.modules.forEach((mod, mIndex) => {
                html += `
                    <div class="bg-cardBg border border-slate-800 rounded-2xl overflow-hidden">
                        <div class="bg-slate-900/50 px-6 py-4 border-b border-slate-800 font-bold text-white flex items-center justify-between">
                            <span>${mod.title}</span>
                            <span class="text-xs text-slate-400">${mod.lessons.length} Lessons</span>
                        </div>
                        <div class="divide-y divide-slate-800">
                `;

                mod.lessons.forEach(les => {
                    const isDone = p.completedLessons[courseId]?.[les.id] || false;
                    html += `
                        <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-800/30 transition">
                            <div class="flex items-center space-x-4 cursor-pointer flex-grow" onclick="router.navigate('lesson-view', '${courseId}', '${les.id}')">
                                <button onclick="event.stopPropagation(); AppState.toggleLessonCompleted('${courseId}', '${les.id}'); router.navigate('course-detail', '${courseId}');" class="w-6 h-6 rounded-lg border ${isDone ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600 hover:border-cyan-400'} flex items-center justify-center text-xs transition">
                                    ${isDone ? '<i class="fa-solid fa-check"></i>' : ''}
                                </button>
                                <div>
                                    <h4 class="text-slate-200 font-medium hover:text-cyan-400 transition">${les.title}</h4>
                                    <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i> ${les.duration} • Official Substantive Notes</span>
                                </div>
                            </div>
                            <button onclick="router.navigate('lesson-view', '${courseId}', '${les.id}')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-cyan-500 hover:text-white text-cyan-400 text-sm font-semibold border border-slate-700 transition">
                                Read Lesson <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            html += `</div></div>`;
            return html;
        }

        /* --- LESSON VIEW --- */
        function renderLessonView(courseId, lessonId) {
            const course = coursesData.find(c => c.id === courseId);
            if(!course) return `Course not found.`;
            
            let currentLesson = null;
            course.modules.forEach(m => {
                m.lessons.forEach(l => {
                    if(l.id === lessonId) currentLesson = l;
                });
            });
            if(!currentLesson) return `Lesson not found.`;

            const notesHtml = course.notes[lessonId] || `<h3>Lesson Content</h3><p>Detailed official notes for ${currentLesson.title}.</p>`;
            const personalNoteText = AppState.getPersonalNotes(courseId, lessonId);
            const isDone = AppState.isLessonCompleted(courseId, lessonId);

            return `
                <div class="space-y-6 py-6">
                    <!-- Breadcrumbs -->
                    <div class="flex items-center space-x-2 text-sm text-slate-400">
                        <span class="hover:text-cyan-400 cursor-pointer" onclick="router.navigate('catalog')">Courses</span>
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                        <span class="hover:text-cyan-400 cursor-pointer" onclick="router.navigate('course-detail', '${courseId}')">${course.title}</span>
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                        <span class="text-slate-200 truncate max-w-xs">${currentLesson.title}</span>
                    </div>

                    <!-- Header -->
                    <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 sm:p-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <span class="text-xs text-cyan-400 font-semibold uppercase tracking-wider">${course.title}</span>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-1">${currentLesson.title}</h1>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="AppState.toggleLessonCompleted('${courseId}', '${lessonId}'); router.navigate('lesson-view', '${courseId}', '${lessonId}');" class="px-5 py-2.5 rounded-xl font-bold border transition ${isDone ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-cyan-400'}">
                                <i class="fa-solid ${isDone ? 'fa-check' : 'fa-circle-check'} mr-2"></i> ${isDone ? 'Completed' : 'Mark as Complete'}
                            </button>
                            <button onclick="router.navigate('course-detail', '${courseId}')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold border border-slate-700 transition">
                                Back to Course
                            </button>
                        </div>
                    </div>

                    <!-- Main Notes & Personal Notes Split -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Official Substantive Notes -->
                        <div class="lg:col-span-2 bg-cardBg border border-slate-800 rounded-3xl p-6 sm:p-10 space-y-6 prose-content">
                            <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
                                <span class="text-sm font-bold text-cyan-400"><i class="fa-solid fa-book-bookmark mr-2"></i> Official Curriculum Notes (Comprehensive Depth)</span>
                                <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i> ${currentLesson.duration}</span>
                            </div>
                            <div>
                                ${notesHtml}
                            </div>
                            <div class="pt-8 border-t border-slate-800 flex items-center justify-between">
                                <button onclick="AppState.toggleLessonCompleted('${courseId}', '${lessonId}'); router.navigate('course-detail', '${courseId}');" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-violet-600 text-white font-bold shadow-lg shadow-cyan-500/20">
                                    Complete & Return <i class="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Personal Notes Sidebar -->
                        <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 space-y-4 h-fit sticky top-24">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-pen-to-square text-violet-400 mr-2"></i> My Personal Notes</h3>
                                <span class="text-xs text-slate-400">Private & Local</span>
                            </div>
                            <p class="text-xs text-slate-400">Record your personal takeaways, code snippets, or thoughts for this lesson. Saved securely in your browser.</p>
                            <textarea id="personal-note-input" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 text-sm focus:outline-none focus:border-cyan-400 transition" placeholder="Type your personal notes here...">${personalNoteText}</textarea>
                            <button onclick="saveUserNotes('${courseId}', '${lessonId}')" class="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold transition">
                                <i class="fa-solid fa-floppy-disk mr-2"></i> Save Personal Notes
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveUserNotes(courseId, lessonId) {
            const val = document.getElementById('personal-note-input').value;
            AppState.savePersonalNotes(courseId, lessonId, val);
            alert('Personal notes saved successfully!');
        }

        /* --- EXAM VIEW (20 QUESTIONS) --- */
        let activeExamState = {
            courseId: null,
            questions: [],
            currentIndex: 0,
            userAnswers: {}
        };

        function renderExamView(courseId) {
            const course = coursesData.find(c => c.id === courseId);
            if(!course) return `Course not found.`;

            // Initialize exam session if not already loaded for this course
            if(activeExamState.courseId !== courseId) {
                // Shuffle and pick exactly 20 questions
                const shuffled = [...course.examQuestions].sort(() => 0.5 - Math.random());
                activeExamState = {
                    courseId: courseId,
                    questions: shuffled.slice(0, 20),
                    currentIndex: 0,
                    userAnswers: {}
                };
            }

            const qList = activeExamState.questions;
            const idx = activeExamState.currentIndex;
            const currentQ = qList[idx];
            const selectedOpt = activeExamState.userAnswers[idx];

            let html = `
                <div class="max-w-3xl mx-auto space-y-8 py-6">
                    <!-- Exam Header -->
                    <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 sm:p-8 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-cyan-400 font-semibold uppercase tracking-wider">Final Examination</span>
                            <h1 class="text-2xl font-extrabold text-white mt-1">${course.title}</h1>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-bold text-slate-300">Question ${idx + 1} of 20</span>
                            <p class="text-xs text-slate-400">Passing Threshold: > 50% (11/20)</p>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 sm:p-10 space-y-6">
                        <h3 class="text-lg sm:text-xl font-bold text-white leading-snug">${idx + 1}. ${currentQ.q}</h3>
                        
                        <div class="space-y-3">
            `;

            currentQ.options.forEach((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx;
                html += `
                    <div onclick="selectExamOption(${idx}, ${oIdx})" class="p-4 rounded-xl border cursor-pointer transition flex items-center space-x-3 ${isSelected ? 'bg-cyan-500/10 border-cyan-500 text-cyan-300' : 'bg-slate-900 border-slate-800 hover:border-slate-700 text-slate-300'}">
                        <div class="w-6 h-6 rounded-full border ${isSelected ? 'border-cyan-400 bg-cyan-500 text-white' : 'border-slate-600'} flex items-center justify-center text-xs font-bold">
                            ${String.fromCharCode(65 + oIdx)}
                        </div>
                        <span class="text-sm font-medium">${opt}</span>
                    </div>
                `;
            });

            html += `
                        </div>

                        <!-- Navigation Controls -->
                        <div class="flex items-center justify-between pt-6 border-t border-slate-800">
                            <button onclick="prevExamQuestion()" ${idx === 0 ? 'disabled class="opacity-50 cursor-not-allowed px-5 py-2.5 rounded-xl bg-slate-800 text-slate-400"' : 'class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold border border-slate-700 transition"'}>
                                <i class="fa-solid fa-arrow-left mr-2"></i> Previous
                            </button>
                            ${idx < 19 ? `
                                <button onclick="nextExamQuestion()" class="px-6 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white font-bold transition">
                                    Next <i class="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            ` : `
                                <button onclick="submitExam('${courseId}')" class="px-8 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-white font-bold shadow-lg shadow-emerald-500/20 transition">
                                    Submit Examination <i class="fa-solid fa-check-double ml-2"></i>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        function selectExamOption(qIdx, optIdx) {
            activeExamState.userAnswers[qIdx] = optIdx;
            renderView();
        }

        function nextExamQuestion() {
            if(activeExamState.currentIndex < 19) {
                activeExamState.currentIndex++;
                renderView();
            }
        }

        function prevExamQuestion() {
            if(activeExamState.currentIndex > 0) {
                activeExamState.currentIndex--;
                renderView();
            }
        }

        function submitExam(courseId) {
            const answeredCount = Object.keys(activeExamState.userAnswers).length;
            if(answeredCount < 20) {
                if(!confirm(`You have only answered ${answeredCount} out of 20 questions. Are you sure you want to submit? Unanswered questions will be marked incorrect.`)) {
                    return;
                }
            }

            let correctCount = 0;
            const detailedAnswers = [];
            activeExamState.questions.forEach((q, i) => {
                const userAns = activeExamState.userAnswers[i] !== undefined ? activeExamState.userAnswers[i] : -1;
                const isCorrect = userAns === q.correct;
                if(isCorrect) correctCount++;
                detailedAnswers.push({
                    q: q.q,
                    options: q.options,
                    userAns: userAns,
                    correct: q.correct,
                    isCorrect: isCorrect,
                    explanation: q.explanation
                });
            });

            const scorePercent = Math.round((correctCount / 20) * 100);
            // Strict passing rule: percentage strictly greater than 50% (> 50)
            const passed = scorePercent > 50;

            AppState.saveExamResult(courseId, scorePercent, passed, detailedAnswers);
            router.navigate('exam-results', courseId);
        }

        /* --- EXAM RESULTS VIEW --- */
        function renderExamResultsView(courseId) {
            const course = coursesData.find(c => c.id === courseId);
            if(!course) return `Course not found.`;
            const res = AppState.getExamResult(courseId);
            if(!res) return `<div class="py-12 text-center">No exam submission found. <button onclick="router.navigate('course-detail', '${courseId}')" class="text-cyan-400 underline">Return to Course</button></div>`;

            const correctCount = Math.round((res.score / 100) * 20);

            return `
                <div class="max-w-3xl mx-auto space-y-8 py-6">
                    <!-- Status Banner -->
                    <div class="bg-cardBg border ${res.passed ? 'border-emerald-500/50 bg-gradient-to-b from-emerald-500/10 to-cardBg' : 'border-red-500/50 bg-gradient-to-b from-red-500/10 to-cardBg'} rounded-3xl p-8 text-center space-y-4">
                        <div class="w-16 h-16 mx-auto rounded-2xl ${res.passed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'} flex items-center justify-center text-3xl font-bold">
                            <i class="fa-solid ${res.passed ? 'fa-award' : 'fa-triangle-exclamation'}"></i>
                        </div>
                        <div>
                            <span class="text-xs uppercase tracking-wider font-bold ${res.passed ? 'text-emerald-400' : 'text-red-400'}">Final Examination Result</span>
                            <h1 class="text-4xl font-extrabold text-white mt-1">${res.passed ? 'PASSED SUCCESSFULLY!' : 'NOT PASSED'}</h1>
                        </div>
                        <p class="text-slate-300 max-w-lg mx-auto">
                            ${res.passed ? 'Congratulations! You demonstrated mastery of the course material and exceeded the 50% passing threshold.' : 'You scored 50% or less. Review the lesson notes below and retake the exam when ready.'}
                        </p>
                        <div class="flex items-center justify-center gap-6 pt-4 text-sm">
                            <div class="bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800">
                                <span class="text-slate-400 block text-xs">Score</span>
                                <span class="text-xl font-extrabold text-white">${res.score}% (${correctCount}/20)</span>
                            </div>
                            <div class="bg-slate-900 px-6 py-3 rounded-2xl border border-slate-800">
                                <span class="text-slate-400 block text-xs">Required Threshold</span>
                                <span class="text-xl font-extrabold text-cyan-400">> 50%</span>
                            </div>
                        </div>
                        <div class="pt-4 flex items-center justify-center gap-4">
                            <button onclick="router.navigate('exam-view', '${courseId}')" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold border border-slate-700 transition">
                                <i class="fa-solid fa-rotate-right mr-2"></i> Retake Examination
                            </button>
                            <button onclick="router.navigate('course-detail', '${courseId}')" class="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white font-bold transition">
                                <i class="fa-solid fa-arrow-left mr-2"></i> Return to Course
                            </button>
                        </div>
                    </div>

                    <!-- Detailed Answer Review -->
                    <div class="space-y-6">
                        <h3 class="text-2xl font-bold text-white">Detailed Question Review</h3>
                        ${res.answers ? res.answers.map((ans, idx) => `
                            <div class="bg-cardBg border ${ans.isCorrect ? 'border-emerald-500/30' : 'border-red-500/30'} rounded-2xl p-6 space-y-3">
                                <div class="flex items-start justify-between gap-4">
                                    <h4 class="text-white font-bold text-base">Q${idx + 1}.${ans.q}</h4>
                                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${ans.isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'} flex-shrink-0">
                                        ${ans.isCorrect ? 'Correct' : 'Incorrect'}
                                    </span>
                                </div>
                                <p class="text-sm text-slate-300"><strong class="text-slate-400">Your Answer:</strong> ${ans.userAns !== -1 ? ans.options[ans.userAns] : 'No Answer'}</p>
                                <p class="text-sm text-slate-300"><strong class="text-emerald-400">Correct Answer:</strong> ${ans.options[ans.correct]}</p>
                                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-xs text-slate-300">
                                    <strong class="text-cyan-400 block mb-1">Explanation:</strong> ${ans.explanation}
                                </div>
                            </div>
                        `).join('') : ''}
                    </div>
                </div>
            `;
        }

        /* --- DASHBOARD VIEW --- */
        function renderDashboardView() {
            const p = AppState.getProgress();
            let completedCount = 0;
            let inProgressCount = 0;

            coursesData.forEach(c => {
                const res = p.courseExams?.[c.id];
                if(res && res.passed) completedCount++;
                else inProgressCount++;
            });

            return `
                <div class="space-y-8 py-6">
                    <div>
                        <h1 class="text-3xl font-extrabold text-white">Student Dashboard</h1>
                        <p class="text-slate-400 mt-1">Track your course progress, examination history, and learning achievements.</p>
                    </div>

                    <!-- Statistics Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-2">
                            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Courses Completed</span>
                            <div class="text-3xl font-extrabold text-emerald-400">${completedCount} / 11</div>
                        </div>
                        <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-2">
                            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Courses In Progress</span>
                            <div class="text-3xl font-extrabold text-cyan-400">${inProgressCount}</div>
                        </div>
                        <div class="bg-cardBg border border-slate-800 rounded-2xl p-6 space-y-2">
                            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Platform Status</span>
                            <div class="text-3xl font-extrabold text-violet-400">100% Verified</div>
                        </div>
                    </div>

                    <!-- Course Status Table -->
                    <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6">
                        <h3 class="text-xl font-bold text-white">Course Progress & Exam Status</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                                        <th class="pb-3 font-semibold">Course Title</th>
                                        <th class="pb-3 font-semibold">Category</th>
                                        <th class="pb-3 font-semibold">Exam Status</th>
                                        <th class="pb-3 font-semibold text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 text-sm">
                                    ${coursesData.map(c => {
                                        const res = p.courseExams?.[c.id];
                                        let statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-400 border border-slate-700">Not Attempted</span>`;
                                        if(res) {
                                            statusBadge = res.passed ? 
                                                `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Passed (${res.score}%)</span>` :
                                                `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30">Failed (${res.score}%)</span>`;
                                        }
                                        return `
                                            <tr class="hover:bg-slate-800/30 transition">
                                                <td class="py-4 font-bold text-white flex items-center space-x-3">
                                                    <div class="w-8 h-8 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-sm">
                                                        <i class="fa-solid ${c.icon}"></i>
                                                    </div>
                                                    <span>${c.title}</span>
                                                </td>
                                                <td class="py-4 text-slate-400">${c.category}</td>
                                                <td class="py-4">${statusBadge}</td>
                                                <td class="py-4 text-right">
                                                    <button onclick="router.navigate('course-detail', '${c.id}')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-cyan-500 hover:text-white text-cyan-400 font-semibold border border-slate-700 transition">
                                                        View Course
                                                    </button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            updateQuickBadge();
            router.navigate('home');
        });
    </script>
</body>
</html>
