        function checkLessonQuizAnswer(qIdx, selectedOpt, correctOpt, explanationStr) {
            const btns = document.querySelectorAll(`.quiz-opt-btn-${qIdx}`);
            const feedbackBox = document.getElementById(`quiz-feedback-${qIdx}`);

            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if(idx === correctOpt) {
                    btn.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300');
                } else if(idx === selectedOpt && selectedOpt !== correctOpt) {
                    btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-300');
                }
            });

            feedbackBox.classList.remove('hidden');
            if(selectedOpt === correctOpt) {
                feedbackBox.classList.add('bg-emerald-950/40', 'border', 'border-emerald-800', 'text-emerald-300');
                feedbackBox.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> Correct!</strong> ${explanationStr}`;

                feedbackBox.classList.add('bg-rose-950/40', 'border', 'border-rose-800', 'text-rose-300');

        function startCourseQuiz(courseId) {
            const course = COURSES_DATA.find(c => c.id === courseId);
            if(!course) return;

            let questions = [];
            course.lessons.forEach(l => {
                if(l.quiz) questions = questions.concat(l.quiz);
            });

            if(questions.length === 0) {
                alert("Quiz content coming soon for this course.");
                return;
            }

            const main = document.getElementById('main-content');
            let currentQIndex = 0;
            let score = 0;

            function renderQuestion() {
                const q = questions[currentQIndex];
                main.innerHTML = `
                    <div class="max-w-2xl mx-auto space-y-6 pt-6">
                        <div class="flex items-center justify-between text-xs text-gray-400">
                            <span>${course.title} Assessment</span>
                            <span>Question ${currentQIndex + 1} of ${questions.length}</span>
                        </div>

                        <div class="glass-card p-6 rounded-2xl space-y-4">
                            <h2 class="text-lg font-bold text-white">${q.question}</h2>
                            <div class="space-y-2 pt-2">
                                ${q.options.map((opt, idx) => `
                                    <button onclick="submitQuizAnswer(${idx})" class="w-full text-left p-3.5 rounded-xl bg-navy-900 hover:bg-cyan-500/10 hover:border-cyan-500 border border-gray-800 text-sm text-gray-200 transition">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            window.submitQuizAnswer = function(selectedIdx) {
                const q = questions[currentQIndex];
                if(selectedIdx === q.answer) score++;

                currentQIndex++;
                if(currentQIndex < questions.length) {
                    renderQuestion();
                } else {
                    const finalPercent = Math.round((score / questions.length) * 100);
                    appState.quizScores[course.id] = Math.max(appState.quizScores[course.id] || 0, finalPercent);
                    appState.xp += finalPercent * 2;
                    saveStore();

                    main.innerHTML = `
                        <div class="max-w-md mx-auto glass-card p-8 rounded-2xl text-center space-y-4 my-12">
                            <div class="w-16 h-16 rounded-full bg-cyan-500/20 text-cyan-400 text-3xl flex items-center justify-center mx-auto">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-white">Assessment Complete!</h2>
                            <div class="text-4xl font-extrabold text-cyan-400">${finalPercent}%</div>
                            <p class="text-xs text-gray-400">You scored ${score} out of ${questions.length} questions correctly.</p>
                            <button onclick="navigateTo('quizzes')" class="w-full py-3 rounded-xl bg-cyan-500 text-white font-bold text-xs uppercase tracking-wider">
                                Return to Practice Engine
                            </button>
                        </div>
                    `;
                }
            };

            renderQuestion();
        }
