<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

            darkMode: 'class',

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        body {

</head>
<body class="bg-navy-950 text-gray-100 min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Top Navigation Bar -->

                </div>

                    <span class="text-gray-600">|</span>
                    <span class="text-cyan-400 flex items-center gap-1"><i class="fa-solid fa-trophy"></i> <span id="header-xp-count">0</span> XP</span>

                <button id="mobile-menu-btn" onclick="toggleMobileNav()" class="md:hidden p-2 text-gray-400 hover:text-white focus:outline-none">

    <!-- Main Container -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto">

            <nav class="space-y-1.5 text-sm font-medium">
                <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-cyan-400"></i> Dashboard

                <button onclick="navigateTo('quizzes')" id="nav-quizzes" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">

                </button>
                <button onclick="navigateTo('projects')" id="nav-projects" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-laptop-code w-5 text-center text-rose-400"></i> Portfolio Projects
                </button>
                <button onclick="navigateTo('progress')" id="nav-progress" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-award w-5 text-center text-yellow-400"></i> Progress & Badges
                </button>
                <button onclick="navigateTo('inspiration')" id="nav-inspiration" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-lightbulb w-5 text-center text-amber-300"></i> Expert Advice
                </button>
                <div class="pt-4 mt-4 border-t border-gray-800/60"></div>
                <button onclick="navigateTo('settings')" id="nav-settings" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-gear w-5 text-center text-gray-400"></i> Settings
                </button>
                <button onclick="navigateTo('about')" id="nav-about" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-circle-info w-5 text-center text-blue-400"></i> About Academy
                </button>
            </nav>
        </aside>

        <!-- Dynamic Content Canvas -->
        <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
            <!-- App Content Injected via Router -->
        </main>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        // ==========================================
        // PROFESSIONAL CURRICULUM DATABASE (60-MIN MODULES & 5+ QUIZZES)
        // ==========================================
        const COURSES_DATA = [
            {
                id: 'course-a',
                code: 'Course A',
                title: 'Advanced Computer Architecture & Systems',
                category: 'Hardware & Systems',
                level: 'Beginner',
                estimatedHours: 60,
                icon: 'fa-desktop',
                color: 'from-blue-500 to-cyan-500',
                description: 'Comprehensive 60-minute professional masterclass on low-level computer architecture, CPU registers, instruction pipelining, memory hierarchy, and deep troubleshooting.',
                lessons: [
                    {
                        id: 'lesson-a1',
                        title: 'Module 1: Deep Dive into CPU Microarchitecture & Execution Cycles',
                        duration: '60 min',
                        objectives: [
                            'Master the comprehensive 6-stage instruction pipeline (Fetch, Decode, Execute, Memory, Writeback)',
                            'Analyze L1, L2, and L3 cache coherency protocols and RAM interfacing speeds',
                            'Examine bus topologies, motherboard chipsets (Northbridge/Southbridge evolution), and clock multipliers'
                        ],
                        vocab: [
                            { word: 'Microarchitecture', def: 'The specific physical realization of a processor architecture, including execution units, register files, and data paths.' },
                            { word: 'Cache Coherency', def: 'The consistency of shared resource data that stored in multiple local caches.' },
                            { word: 'Instruction Pipelining', def: 'A technique where multiple instructions are overlapped during execution across independent stages.' }
                        ],
                        explanation: `Modern computing systems rely on intricate microarchitectural designs to execute billions of instructions per second. At the center is the Central Processing Unit (CPU), communicating over high-speed buses with system memory (DRAM) and specialized hardware accelerators.

1. The Instruction Execution Pipeline:
Processors do not simply run one instruction completely from scratch before starting the next. Instead, instruction handling is divided into distinct stages:
- Instruction Fetch (IF): The instruction pointer (IP) retrieves the next instruction machine code from L1 instruction cache or main memory.
- Instruction Decode (ID): Control units translate the binary machine code instruction into internal micro-operations (uops) and identify required register operands.
- Execute (EX): Arithmetic Logic Units (ALUs) or Floating-Point Units (FPUs) perform mathematical or logical evaluations.
- Memory Access (MEM): Data values are read from or written to data cache or system RAM if required by load/store instructions.
- Writeback (WB): Final results are committed back to the CPU register file.

2. Memory Hierarchy & Latency Gaps:
While processor cores operate at gigahertz speeds, main system RAM operates significantly slower relative to CPU cycles. To bridge this latency gap, chip designers implement tiered memory caches:
- L1 Cache: Extremely fast, dedicated per-core cache (typically split into L1i for instructions and L1d for data, ~3-5 cycle latency).
- L2 Cache: Larger per-core cache (~10-14 cycle latency).
- L3 Cache: Shared multi-megabyte cache across all processor cores (~30-50 cycle latency).
- System RAM (DDR4/DDR5): Hundreds of cycles latency, acting as the working workspace for active applications.

3. Troubleshooting Hardware Bottlenecks:
When diagnosing system slowdowns, administrators analyze hardware telemetry such as cache miss rates, thermal throttling events, and memory bandwidth saturation using low-level kernel profiling tools.`,
                        codeExample: `// CPU Core Telemetry & Simulation Engine
class CPUSubsystem {
    constructor(model, cores, clockGHz) {
        this.model = model;
        this.cores = cores;
        this.clockGHz = clockGHz;
        this.cacheHitRate = 0.965; // 96.5% L1/L2 cache efficiency
    }

    simulateInstructionCycle(instructionsCount) {
        const effectiveCycles = instructionsCount * (1 - this.cacheHitRate) * 45;
        console.log(\`[CPU Diagnostic] Processing \${instructionsCount} ops on \${this.model}...\`);
        console.log(\`Estimated Latency Overhead: \${effectiveCycles.toFixed(2)} wait cycles due to cache/RAM bottlenecks.\`);
    }
}

const workstationCPU = new CPUSubsystem("AMD Ryzen 9 7950X", 16, 4.5);
workstationCPU.simulateInstructionCycle(1000000);`,
                        codeExplanation: "This advanced JavaScript class models processor telemetry, quantifying execution latency based on cache efficiency metrics.",
                        activity: "Inspect your system's processor details via command line (`lscpu` on Linux or `wmic cpu get name` on Windows) and calculate theoretical maximum instructions per second.",
                        quiz: [
                            {
                                question: "What is the primary purpose of the multi-level CPU cache hierarchy (L1, L2, L3)?",
                                options: [
                                    "To permanently store user documents and operating system files",
                                    "To bridge the speed and latency gap between ultra-fast CPU registers and slower system RAM",
                                    "To handle graphical rendering and video game frame rates exclusively",
                                    "To manage external USB peripheral power distribution"
                                ],
                                answer: 1,
                                explanation: "Cache memory provides extremely low-latency temporary storage close to execution cores, mitigating the performance bottleneck of waiting for main system RAM."
                            },
                            {
                                question: "During which stage of the instruction pipeline are mathematical operations performed?",
                                options: ["Instruction Fetch", "Instruction Decode", "Execute (EX)", "Writeback"],
                                answer: 2,
                                explanation: "The Execute stage utilizes Arithmetic Logic Units (ALUs) to perform calculations and evaluations."
                            },
                            {
                                question: "Why is L1 cache typically separated into L1i and L1d?",
                                options: [
                                    "To separate instruction code retrieval from active data manipulation for enhanced pipeline parallelism",
                                    "To reduce manufacturing costs on silicon wafers",
                                    "To comply with international USB hardware standards",
                                    "To allow the system to boot without a motherboard"
                                ],
                                answer: 0,
                                explanation: "Splitting L1 cache into instruction (L1i) and data (L1d) prevents resource contention during simultaneous instruction fetches and data reads/writes."
                            },
                            {
                                question: "What does a high cache miss rate signify in system performance diagnostics?",
                                options: [
                                    "The CPU is running too cold",
                                    "The processor is frequently forced to wait for slower system RAM, causing performance degradation",
                                    "The power supply unit is failing",
                                    "The hard drive has run out of storage space"
                                ],
                                answer: 1,
                                explanation: "Cache misses force the CPU to fetch data from slower memory tiers, introducing wait states and reducing processing throughput."
                            },
                            {
                                question: "Which component coordinates data transfer between CPU, RAM, and peripheral expansion cards?",
                                options: ["The power supply fan", "The motherboard chipset and system bus architecture", "The monitor display cable", "The Ethernet connector pinout"],
                                answer: 1,
                                explanation: "Motherboard chipsets and high-speed buses manage communication pathways between core computing subsystems."
                            }
                        ]
                    }
                ]
            }
        ];

        // ==========================================
        // PROJECTS & INSPIRATION DATABASE
        // ==========================================
        const PROJECTS_DATA = [
            {
                id: 'proj-1',
                title: 'Enterprise Hardware Diagnostics & Telemetry Audit',
                courseId: 'course-a',
                level: 'Advanced',
                description: 'Perform a comprehensive low-level hardware audit and write a professional diagnostic report evaluating CPU utilization, cache efficiency, and memory bottlenecks.',
                steps: [
                    'Deploy kernel profiling tools to extract detailed CPU cache and pipeline metrics.',
                    'Measure memory bandwidth using specialized benchmarking utilities.',
                    'Analyze thermal sensor logs under peak load conditions.',
                    'Compile a formal executive technical report detailing hardware upgrade recommendations.'
                ]
            }
        ];

        const INSPIRATION_DATA = [
            {
                quote: "Excellence is not a skill, it is an attitude maintained through rigorous daily practice.",
                author: "System Architecture Expert",
                tip: "Dedicate uninterrupted blocks of 60 minutes daily to deep technical reading and hands-on laboratory experimentation."
            }
        ];

        // ==========================================
        // APPLICATION STATE & STORAGE ENGINE
        // ==========================================
        const STORAGE_KEY = 'TECHMATE_ACADEMY_PRO_STATE_V2';

        let appState = {
            completedLessons: [],
            quizScores: {},
            completedProjects: [],
            xp: 0,
            streakDays: 1,
            lastActiveDate: new Date().toISOString().split('T')[0],
            currentActiveLessonId: 'lesson-a1'
        };

        function initStore() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                } else {
                    saveStore();
                }
            } catch (e) {
                console.error("Storage initialization error", e);
            }
            updateHeaderStats();
        }

        function saveStore() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.warn("Storage save failed", e);
            }
            updateHeaderStats();
        }

        function updateHeaderStats() {
            document.getElementById('header-streak-count').innerText = appState.streakDays;
            document.getElementById('header-xp-count').innerText = appState.xp;
        }

        let currentView = 'dashboard';

        function navigateTo(viewId, param = null) {
            currentView = viewId;
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) activeNav.classList.add('active');

            const sidebar = document.getElementById('sidebar-nav');
            if (!sidebar.classList.contains('hidden') && window.innerWidth < 768) {
                sidebar.classList.add('hidden');
            }

            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            switch (viewId) {
                case 'dashboard': renderDashboard(main); break;
                case 'courses': renderCoursesView(main); break;
                case 'my-learning': renderMyLearningView(main); break;
                case 'lesson-view': renderLessonView(main, param || appState.currentActiveLessonId); break;
                case 'quizzes': renderQuizzesView(main); break;
                case 'projects': renderProjectsView(main); break;
                case 'progress': renderProgressView(main); break;
                case 'inspiration': renderInspirationView(main); break;
                case 'settings': renderSettingsView(main); break;
                case 'about': renderAboutView(main); break;
                default: renderDashboard(main);
            }
        }

        function toggleMobileNav() {
            const sidebar = document.getElementById('sidebar-nav');
            sidebar.classList.toggle('hidden');
            if(!sidebar.classList.contains('hidden')) {
                sidebar.classList.add('absolute', 'top-16', 'left-0', 'z-50', 'w-64', 'bg-navy-900', 'shadow-2xl');
            }
        }

        function getTotalLessonsCount() {
            let total = 0;
            COURSES_DATA.forEach(c => total += c.lessons.length);
            return total;
        }

        // ==========================================
        // VIEW RENDERERS
        // ==========================================
        function renderDashboard(container) {
            const totalLessons = getTotalLessonsCount();
            const completedCount = appState.completedLessons.length;
            const overallPercent = Math.round((completedCount / totalLessons) * 100) || 0;

            container.innerHTML = `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div class="glass-card rounded-2xl p-6 sm:p-8 relative overflow-hidden border border-cyan-500/20 bg-gradient-to-r from-navy-900 via-navy-800 to-navy-900">
                        <div class="relative z-10 space-y-3">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">
                                <i class="fa-solid fa-graduation-cap"></i> Professional Masterclass Edition
                            </div>
                            <h1 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">Advanced IT Engineering Academy</h1>
                            <p class="text-gray-400 text-sm sm:text-base max-w-2xl">Rigorous 60-minute professional training modules engineered for elite technical careers, systems engineering, and architecture mastery.</p>
                            <div class="pt-2 flex flex-wrap gap-4">
                                <button onclick="navigateTo('lesson-view', '${appState.currentActiveLessonId}')" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold text-sm shadow-lg shadow-cyan-500/25 flex items-center gap-2 transition">
                                    <i class="fa-solid fa-play"></i> Resume Masterclass
                                </button>
                                <button onclick="navigateTo('courses')" class="px-5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold text-sm border border-gray-700 transition">
                                    Explore Curriculum
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="glass-card p-4 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Mastery Progress</span>
                            <div class="text-2xl font-bold text-cyan-400 mt-1">${overallPercent}%</div>
                            <div class="w-full bg-gray-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div class="bg-cyan-400 h-full" style="width: ${overallPercent}%"></div>
                            </div>
                        </div>
                        <div class="glass-card p-4 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Completed Modules</span>
                            <div class="text-2xl font-bold text-emerald-400 mt-1">${completedCount} / ${totalLessons}</div>
                            <span class="text-xs text-gray-500 mt-1 block">60-Min Sessions</span>
                        </div>
                        <div class="glass-card p-4 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Streak</span>
                            <div class="text-2xl font-bold text-amber-400 mt-1">${appState.streakDays} Days</div>
                            <span class="text-xs text-gray-500 mt-1 block">Active engagement</span>
                        </div>
                        <div class="glass-card p-4 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">XP Earned</span>
                            <div class="text-2xl font-bold text-violet-400 mt-1">${appState.xp} XP</div>
                            <span class="text-xs text-gray-500 mt-1 block">Skill score</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="text-xl font-bold text-white tracking-tight">Core Masterclass Curriculum</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            ${COURSES_DATA.map(course => renderCourseCardHTML(course)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCourseCardHTML(course) {
            let completedInCourse = 0;
            course.lessons.forEach(l => {
                if(appState.completedLessons.includes(l.id)) completedInCourse++;
            });
            const coursePercent = Math.round((completedInCourse / course.lessons.length) * 100) || 0;

            return `
                <div class="glass-card glass-card-hover rounded-2xl p-5 flex flex-col justify-between space-y-4">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="px-2.5 py-1 rounded-md text-[11px] font-semibold uppercase tracking-wider bg-navy-800 text-gray-300 border border-gray-700">${course.code}</span>
                            <span class="text-xs font-medium px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">${course.level}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${course.color} flex items-center justify-center text-white text-lg shadow-md">
                                <i class="${course.icon}"></i>
                            </div>
                            <h3 class="font-bold text-lg text-white leading-snug">${course.title}</h3>
                        </div>
                        <p class="text-xs text-gray-400 line-clamp-3 leading-relaxed">${course.description}</p>
                    </div>

                    <div class="space-y-3 pt-2 border-t border-gray-800/80">
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${course.estimatedHours} Hours Masterclass</span>
                            <span>${completedInCourse} / ${course.lessons.length}</span>
                        </div>
                        <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r ${course.color} h-full" style="width: ${coursePercent}%"></div>
                        </div>
                        <button onclick="navigateTo('lesson-view', '${course.lessons[0].id}')" class="w-full py-2.5 rounded-xl bg-gray-800 hover:bg-cyan-600 hover:text-white text-cyan-400 text-xs font-bold tracking-wide transition border border-gray-700 hover:border-cyan-500">
                            Launch 60-Min Module
                        </button>
                    </div>
                </div>
            `;
        }

        function renderCoursesView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Masterclass Course Catalog</h1>
                        <p class="text-sm text-gray-400">Comprehensive, rigorous professional IT training modules.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${COURSES_DATA.map(course => renderCourseCardHTML(course)).join('')}
                    </div>
                </div>
            `;
        }

        function renderMyLearningView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">My Learning Studio</h1>
                        <p class="text-sm text-gray-400">Track active masterclass modules and progress.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${COURSES_DATA.map(c => renderCourseCardHTML(c)).join('')}
                    </div>
                </div>
            `;
        }

        function renderLessonView(container, lessonId) {
            appState.currentActiveLessonId = lessonId;
            saveStore();

            let currentCourse = null;
            let currentLesson = null;

            for (const course of COURSES_DATA) {
                const found = course.lessons.find(l => l.id === lessonId);
                if (found) {
                    currentCourse = course;
                    currentLesson = found;
                    break;
                }
            }

            if (!currentLesson) {
                container.innerHTML = `<div class="p-8 text-center text-rose-400">Lesson not found.</div>`;
                return;
            }

            const isCompleted = appState.completedLessons.includes(currentLesson.id);

            container.innerHTML = `
                <div class="space-y-8 max-w-4xl mx-auto pb-16">
                    <div class="flex items-center justify-between text-xs text-gray-400 border-b border-gray-800 pb-4">
                        <button onclick="navigateTo('courses')" class="hover:text-cyan-400 flex items-center gap-1">
                            <i class="fa-solid fa-arrow-left"></i> ${currentCourse.title}
                        </button>
                        <span class="px-2 py-0.5 rounded bg-navy-800 text-cyan-400 font-semibold border border-gray-800">${currentCourse.code} — 60-Minute Masterclass</span>
                    </div>

                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/20">${currentCourse.level} Professional</span>
                            <span class="text-xs text-gray-400"><i class="fa-regular fa-clock mr-1"></i> ${currentLesson.duration} Session</span>
                        </div>
                        <h1 class="text-2xl sm:text-4xl font-extrabold text-white">${currentLesson.title}</h1>
                    </div>

                    <div class="glass-card p-6 rounded-2xl border-l-4 border-l-cyan-400 space-y-3 bg-navy-900/60">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-bullseye"></i> Masterclass Learning Objectives
                        </h3>
                        <ul class="space-y-2 text-sm text-gray-300">
                            ${currentLesson.objectives.map(obj => `<li class="flex items-start gap-2"><i class="fa-solid fa-check text-cyan-400 mt-1 text-xs"></i> <span>${obj}</span></li>`).join('')}
                        </ul>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-book text-violet-400"></i> Advanced Technical Vocabulary
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            ${currentLesson.vocab.map(v => `
                                <div class="glass-card p-4 rounded-xl space-y-1">
                                    <span class="text-xs font-bold text-violet-400">${v.word}</span>
                                    <p class="text-xs text-gray-400 leading-relaxed">${v.def}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="space-y-6 text-base text-gray-300 leading-relaxed border-t border-gray-800/80 pt-6">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-file-lines text-cyan-400"></i> Comprehensive In-Depth Lecture & Explanation
                        </h3>
                        <div class="whitespace-pre-line space-y-4 text-gray-300 bg-navy-900/40 p-6 rounded-2xl border border-gray-800">
                            ${currentLesson.explanation}
                        </div>
                    </div>

                    ${currentLesson.codeExample ? `
                        <div class="space-y-3 border-t border-gray-800/80 pt-6">
                            <div class="flex items-center justify-between">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-2">
                                    <i class="fa-solid fa-code text-emerald-400"></i> Professional Code Example & Architecture Script
                                </h3>
                            </div>
                            <pre class="bg-navy-950 p-5 rounded-xl text-xs sm:text-sm text-gray-200 border border-gray-800 overflow-x-auto font-mono"><code>${escapeHtml(currentLesson.codeExample)}</code></pre>
                            <p class="text-xs text-gray-400 italic">${currentLesson.codeExplanation}</p>
                        </div>
                    ` : ''}

                    <div class="p-6 rounded-2xl bg-gradient-to-r from-emerald-950/30 to-navy-900 border border-emerald-800/30 space-y-2">
                        <h4 class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-vial"></i> Hands-on Practical Lab Exercise
                        </h4>
                        <p class="text-sm text-gray-300">${currentLesson.activity}</p>
                    </div>

                    <!-- 5+ Knowledge Assessment Questions -->
                    <div class="glass-card p-6 sm:p-8 rounded-2xl space-y-6 border border-gray-800">
                        <div class="border-b border-gray-800 pb-4 flex items-center justify-between">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-amber-400"></i> Comprehensive Assessment (5+ Questions)
                            </h3>
                            <span class="text-xs px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">${currentLesson.quiz.length} Rigorous Questions</span>
                        </div>

                        <div id="lesson-quiz-container" class="space-y-8">
                            ${currentLesson.quiz.map((q, idx) => `
                                <div class="space-y-3 pb-6 border-b border-gray-800/60 last:border-0" id="quiz-q-${idx}">
                                    <p class="text-sm sm:text-base font-semibold text-gray-200">${idx + 1}.${q.question}</p>
                                    <div class="space-y-2.5">
                                        ${q.options.map((opt, optIdx) => `
                                            <button onclick="checkLessonQuizAnswer(${idx}, ${optIdx}, ${q.answer}, '${escapeJsString(q.explanation)}')" class="quiz-opt-btn-${idx} w-full text-left p-3.5 rounded-xl bg-navy-900 hover:bg-gray-800 border border-gray-800 text-xs sm:text-sm text-gray-300 transition">
                                                ${opt}
                                            </button>
                                        `).join('')}
                                    </div>
                                    <div id="quiz-feedback-${idx}" class="hidden p-3 rounded-xl text-xs space-y-1 mt-2"></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-6 border-t border-gray-800">
                        <button onclick="toggleLessonComplete('${currentLesson.id}')" id="mark-complete-btn" class="px-8 py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider transition ${isCompleted ? 'bg-emerald-500 text-white' : 'bg-cyan-500 hover:bg-cyan-400 text-white shadow-lg shadow-cyan-500/20'}">
                            ${isCompleted ? '<i class="fa-solid fa-circle-check mr-1"></i> Module Completed (+100 XP)' : 'Mark Masterclass Module Complete'}
                        </button>
                    </div>
                </div>
            `;
        }

        function checkLessonQuizAnswer(qIdx, selectedOpt, correctOpt, explanationStr) {
            const btns = document.querySelectorAll(`.quiz-opt-btn-${qIdx}`);
            const feedbackBox = document.getElementById(`quiz-feedback-${qIdx}`);

            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if(idx === correctOpt) {
                    btn.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300');
                } else if(idx === selectedOpt && selectedOpt !== correctOpt) {
                    btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-300');
                }
            });

            feedbackBox.classList.remove('hidden');
            if(selectedOpt === correctOpt) {
                feedbackBox.classList.add('bg-emerald-950/40', 'border', 'border-emerald-800', 'text-emerald-300');
                feedbackBox.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> Correct!</strong> ${explanationStr}`;
            } else {
                feedbackBox.classList.add('bg-rose-950/40', 'border', 'border-rose-800', 'text-rose-300');
                feedbackBox.innerHTML = `<strong><i class="fa-solid fa-circle-xmark"></i> Incorrect.</strong> ${explanationStr}`;
            }
        }

        function toggleLessonComplete(lessonId) {
            if(!appState.completedLessons.includes(lessonId)) {
                appState.completedLessons.push(lessonId);
                appState.xp += 100;
            } else {
                appState.completedLessons = appState.completedLessons.filter(id => id !== lessonId);
            }
            saveStore();
            renderLessonView(document.getElementById('main-content'), lessonId);
        }

        function renderQuizzesView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Assessment & Practice Engine</h1>
                        <p class="text-sm text-gray-400">Evaluate professional competencies with in-depth technical tests.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${COURSES_DATA.map(course => `
                            <div class="glass-card p-5 rounded-2xl flex flex-col justify-between space-y-4">
                                <div class="space-y-2">
                                    <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${course.code}</span>
                                    <h3 class="font-bold text-white text-base">${course.title} Masterclass Exam</h3>
                                    <p class="text-xs text-gray-400">Covers advanced architecture, micro-operations, and system troubleshooting.</p>
                                </div>
                                <button onclick="navigateTo('lesson-view', '${course.lessons[0].id}')" class="w-full py-2.5 rounded-xl bg-navy-800 hover:bg-cyan-600 hover:text-white text-cyan-400 text-xs font-bold transition border border-gray-700">
                                    Start Assessment Module
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProjectsView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Portfolio Projects</h1>
                        <p class="text-sm text-gray-400">Real-world practical projects for your technical resume.</p>
                    </div>
                    <div class="space-y-5">
                        ${PROJECTS_DATA.map(proj => `
                            <div class="glass-card p-6 rounded-2xl space-y-4">
                                <h3 class="text-lg font-bold text-white">${proj.title}</h3>
                                <p class="text-sm text-gray-300">${proj.description}</p>
                                <ul class="space-y-1 text-xs text-gray-400">
                                    ${proj.steps.map(s => `<li>• ${s}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProgressView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-5xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Progress & Skill Achievements</h1>
                        <p class="text-sm text-gray-400">Track your earned credentials and XP score.</p>
                    </div>
                    <div class="glass-card p-6 rounded-2xl space-y-4">
                        <div class="text-2xl font-bold text-cyan-400">${appState.xp} Total XP Earned</div>
                        <p class="text-xs text-gray-400">Keep completing 60-minute masterclass modules to level up your engineering career.</p>
                    </div>
                </div>
            `;
        }

        function renderInspirationView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Expert Advice & Study Habits</h1>
                        <p class="text-sm text-gray-400">Guidance from industry veterans.</p>
                    </div>
                    <div class="glass-card p-6 rounded-2xl space-y-3">
                        <p class="text-base text-gray-200 italic">"${INSPIRATION_DATA[0].quote}"</p>
                        <span class="text-xs font-bold text-cyan-400 block">— ${INSPIRATION_DATA[0].author}</span>
                        <p class="text-xs text-gray-400 pt-2 border-t border-gray-800"><strong>Tip:</strong> ${INSPIRATION_DATA[0].tip}</p>
                    </div>
                </div>
            `;
        }

        function renderSettingsView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-3xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Platform Settings</h1>
                        <p class="text-sm text-gray-400">Configure your learning workspace.</p>
                    </div>
                    <div class="glass-card p-6 rounded-2xl">
                        <p class="text-xs text-gray-400">All progress is stored securely in your browser's local storage engine.</p>
                    </div>
                </div>
            `;
        }

        function renderAboutView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-3xl mx-auto">
                    <div class="glass-card p-8 rounded-2xl space-y-4 text-center">
                        <h1 class="text-2xl font-extrabold text-white">TechMate Academy Pro</h1>
                        <p class="text-sm text-gray-300 leading-relaxed max-w-lg mx-auto">
                            A professional, self-contained educational platform delivering rigorous 60-minute technical masterclasses and deep architectural training.
                        </p>
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
        }

        window.onload = function() {
            initStore();
            navigateTo('dashboard');
        };
    </script>
</body>
</html>
