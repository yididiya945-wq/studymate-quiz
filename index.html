<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMate Academy Pro — Global Professional IT Learning & Certification Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0B1120',
                            900: '#070C18',
                            950: '#030712'
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                        },
                        violet: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }

        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 20px 35px -10px rgba(6, 182, 212, 0.2);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.2) 0%, rgba(124, 58, 237, 0.08) 100%);
            border-left: 3px solid #22d3ee;
            color: #38bdf8;
        }
    </style>
</head>
<body class="bg-navy-950 text-gray-100 min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-40 border-b border-gray-800 bg-navy-900/90 backdrop-blur-md">
        <div class="px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('dashboard')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20 font-extrabold text-xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <span class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">TechMate</span>
                    <span class="text-xs font-semibold uppercase tracking-wider text-cyan-400 block -mt-1">Academy Pro</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-3 px-3 py-1.5 rounded-full bg-navy-800 border border-gray-800 text-xs">
                    <span class="text-amber-400 flex items-center gap-1"><i class="fa-solid fa-fire"></i> <span id="header-streak-count">1</span> Day Streak</span>
                    <span class="text-gray-600">|</span>
                    <span class="text-cyan-400 flex items-center gap-1"><i class="fa-solid fa-trophy"></i> <span id="header-xp-count">150</span> XP</span>
                </div>

                <button id="mobile-menu-btn" onclick="toggleMobileNav()" class="md:hidden p-2 text-gray-400 hover:text-white focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto relative">
        <!-- Sidebar Navigation -->
        <aside id="sidebar-nav" class="hidden md:flex flex-col w-64 border-r border-gray-800/80 bg-navy-900/50 p-4 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto">
            <nav class="space-y-1.5 text-sm font-medium">
                <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-cyan-400"></i> Dashboard
                </button>
                <button onclick="navigateTo('courses')" id="nav-courses" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-book-open w-5 text-center text-violet-400"></i> IT Curriculum (A-L)
                </button>
                <button onclick="navigateTo('my-learning')" id="nav-my-learning" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-laptop-code w-5 text-center text-emerald-400"></i> My Learning Studio
                </button>
                <button onclick="navigateTo('quizzes')" id="nav-quizzes" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-list-check w-5 text-center text-amber-400"></i> Global Quizzes
                </button>
                <button onclick="navigateTo('projects')" id="nav-projects" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-terminal w-5 text-center text-rose-400"></i> Hands-on Labs
                </button>
                <button onclick="navigateTo('progress')" id="nav-progress" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-award w-5 text-center text-yellow-400"></i> Badges & Analytics
                </button>
                <button onclick="navigateTo('inspiration')" id="nav-inspiration" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-lightbulb w-5 text-center text-amber-300"></i> Expert Tips
                </button>
                <div class="pt-4 mt-4 border-t border-gray-800/60"></div>
                <button onclick="navigateTo('settings')" id="nav-settings" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-gear w-5 text-center text-gray-400"></i> Settings
                </button>
                <button onclick="navigateTo('about')" id="nav-about" class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-circle-info w-5 text-center text-blue-400"></i> About Academy
                </button>
            </nav>
        </aside>

        <!-- Dynamic Content Canvas -->
        <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
            <!-- Dynamic Views Injected Here -->
        </main>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        const COURSES_DATA = [
            {
                id: 'course-a', code: 'Course A', title: 'Computer Fundamentals & Architecture', category: 'Hardware', level: 'Beginner', estimatedHours: 8, icon: 'fa-desktop', color: 'from-blue-500 to-cyan-500',
                description: 'Master computer hardware architecture, CPU fetch-decode-execute cycle, binary logic, and system troubleshooting.',
                lessons: [
                    {
                        id: 'lesson-a1', title: '1. Computer Architecture & Internal Hardware', duration: '25 min',
                        objectives: ['Identify internal hardware components', 'Understand CPU execution cycle', 'Differentiate RAM and ROM'],
                        vocab: [{ word: 'CPU', def: 'Central Processing Unit.' }, { word: 'RAM', def: 'Volatile high-speed working memory.' }],
                        explanation: `Computers rely on integrated hardware circuits managed by operating systems. The CPU acts as the computational engine executing instructions via the fetch-decode-execute cycle.`,
                        codeExample: `const systemSpec = { cpu: "8-Core 3.2GHz", ram: "16GB DDR4", status: "Optimal" }; console.log(systemSpec);`,
                        activity: 'Open your Task Manager and analyze current resource allocation.',
                        quiz: [{ question: 'Which memory type is volatile?', options: ['ROM', 'RAM', 'SSD', 'Flash'], answer: 1, explanation: 'RAM requires continuous power.' }]

                ]
            },
            {
                id: 'course-b', code: 'Course B', title: 'Operating Systems & CLI Mastery', category: 'Systems', level: 'Beginner', estimatedHours: 10, icon: 'fa-brands fa-linux', color: 'from-cyan-500 to-blue-600',
                description: 'Explore OS kernels, file system permissions, process management, and professional Linux/Unix command-line navigation.',
                lessons: [
                    {
                        id: 'lesson-b1', title: '1. Kernel & Command Line Interface', duration: '30 min',
                        objectives: ['Understand Kernel responsibilities', 'Execute Bash terminal commands'],
                        vocab: [{ word: 'Kernel', def: 'Core OS system manager.' }],
                        explanation: `The Operating System Kernel bridges physical hardware and user applications, controlling memory and CPU scheduling.`,
                        codeExample: `pwd && ls -la && uname -r`,
                        activity: 'Run system directory checks in your local terminal.',
                        quiz: [{ question: 'What is the primary role of the Kernel?', options: ['Design UI', 'Manage system resources', 'Browse Web', 'Compile Code'], answer: 1, explanation: 'Kernel manages hardware interactions.' }]
                    }
                ]
            },
            {
                id: 'course-c', code: 'Course C', title: 'Internet Protocols & Networking', category: 'Networking', level: 'Intermediate', estimatedHours: 12, icon: 'fa-solid fa-network-wired', color: 'from-violet-500 to-indigo-600',
                description: 'Deep dive into TCP/IP models, IPv4/IPv6 addressing, DNS resolution, DHCP, routers, switches, and network security.',
                lessons: [{ id: 'lesson-c1', title: '1. IP Addressing & Subnetting', duration: '35 min', objectives: ['Understand IP octets and DNS'], vocab: [{ word: 'DNS', def: 'Domain Name System.' }], explanation: `Networking relies on standardized protocols to route packets globally across interconnected autonomous systems.`, codeExample: `ping -c 4 8.8.8.8`, activity: 'Check local IP config.', quiz: [{ question: 'What does DHCP do?', options: ['Assigns IPs', 'Renders HTML', 'Encrypts DB', 'Parses JSON'], answer: 0, explanation: 'DHCP leases dynamic IPs.' }] }]
            },
            {
                id: 'course-d', code: 'Course D', title: 'Cybersecurity Fundamentals & Defense', category: 'Security', level: 'Intermediate', estimatedHours: 10, icon: 'fa-solid fa-shield-halved', color: 'from-rose-500 to-red-600',
                description: 'Learn the CIA triad, threat vectors, multi-factor authentication, endpoint protection, and standard cryptography.',
                lessons: [{ id: 'lesson-d1', title: '1. The CIA Triad', duration: '25 min', objectives: ['Confidentiality, Integrity, Availability'], vocab: [{ word: 'CIA', def: 'Security Triad.' }], explanation: `Information security protects assets against breaches ensuring confidentiality, integrity, and availability.`, codeExample: `const secureHash = (txt) => btoa(txt);`, activity: 'Enable MFA on personal accounts.', quiz: [{ question: 'What ensures data is un-tampered?', options: ['Integrity', 'Availability', 'Speed', 'Storage'], answer: 0, explanation: 'Integrity checks modification.' }] }]
            },
            {
                id: 'course-e', code: 'Course E', title: 'Programming Logic & Software Engineering', category: 'Software', level: 'Beginner', estimatedHours: 14, icon: 'fa-solid fa-code', color: 'from-emerald-500 to-teal-600',
                description: 'Master variables, control structures, algorithms, object-oriented paradigms, and clean code principles.',
                lessons: [{ id: 'lesson-e1', title: '1. Algorithms & Control Flow', duration: '40 min', objectives: ['Write loops and conditionals'], vocab: [{ word: 'Algorithm', def: 'Step-by-step logic.' }], explanation: `Programming translates human intent into machine-executable algorithmic instructions.`, codeExample: `[1,2,3,4,5].forEach(n => console.log(n * 2));`, activity: 'Write an even number generator.', quiz: [{ question: 'What repeats code?', options: ['Loop', 'Variable', 'String', 'Integer'], answer: 0, explanation: 'Loops automate repetition.' }] }]
            },
            {
                id: 'course-f', code: 'Course F', title: 'Modern Web Development', category: 'Web', level: 'Beginner', estimatedHours: 16, icon: 'fa-brands fa-html5', color: 'from-amber-500 to-orange-600',
                description: 'Build responsive web applications using semantic HTML5, modern CSS Grid/Flexbox, and asynchronous JavaScript DOM manipulation.',
                lessons: [{ id: 'lesson-f1', title: '1. Semantic HTML & Flexbox', duration: '45 min', objectives: ['Build responsive layouts'], vocab: [{ word: 'DOM', def: 'Document Object Model.' }], explanation: `Web technologies structure, style, and dynamically update user interfaces across modern browsers.`, codeExample: `<div style="display:flex;">Flexbox Layout</div>`, activity: 'Build a landing page layout.', quiz: [{ question: 'Which is 1D layout?', options: ['Flexbox', 'Grid', 'Block', 'Inline'], answer: 0, explanation: 'Flexbox handles single axes.' }] }]
            },
            {
                id: 'course-g', code: 'Course G', title: 'Relational Databases & SQL', category: 'Data', level: 'Intermediate', estimatedHours: 12, icon: 'fa-solid fa-database', color: 'from-indigo-500 to-blue-700',
                description: 'Master database schemas, primary/foreign keys, CRUD operations, aggregate functions, and complex SQL JOIN queries.',
                lessons: [{ id: 'lesson-g1', title: '1. Relational Queries & SQL', duration: '35 min', objectives: ['Write SELECT statements and JOINs'], vocab: [{ word: 'SQL', def: 'Structured Query Language.' }], explanation: `Databases store structured records efficiently, queried via robust SQL standards.`, codeExample: `SELECT * FROM users WHERE status = 'ACTIVE';`, activity: 'Query user tables.', quiz: [{ question: 'Which clause filters rows?', options: ['WHERE', 'SELECT', 'FROM', 'ORDER'], answer: 0, explanation: 'WHERE applies row conditions.' }] }]
            },
            {
                id: 'course-h', code: 'Course H', title: 'IT Support & Troubleshooting Methodologies', category: 'Support', level: 'Beginner', estimatedHours: 8, icon: 'fa-solid fa-screwdriver-wrench', color: 'from-blue-600 to-slate-700',
                description: 'Professional problem-solving frameworks, CompTIA troubleshooting steps, hardware diagnostics, and helpdesk ticket management.',
                lessons: [{ id: 'lesson-h1', title: '1. Diagnostic Frameworks', duration: '25 min', objectives: ['Apply 6-step troubleshooting'], vocab: [{ word: 'SLA', def: 'Service Level Agreement.' }], explanation: `Structured IT support minimizes downtime and resolves technical failures methodically.`, codeExample: `const resolveTicket = (id) => `Ticket ${id} Closed`;`, activity: 'Draft a support ticket resolution log.', quiz: [{ question: 'What is step 1 in troubleshooting?', options: ['Identify problem', 'Replace hardware', 'Reinstall OS', 'Close ticket'], answer: 0, explanation: 'Always identify symptoms first.' }] }]
            },
            {
                id: 'course-i', code: 'Course I', title: 'Cloud Computing & Virtualization', category: 'Cloud', level: 'Intermediate', estimatedHours: 10, icon: 'fa-solid fa-cloud', color: 'from-sky-500 to-blue-600',
                description: 'Explore IaaS, PaaS, SaaS cloud models, AWS/Azure infrastructure, containerization, and IAM security policies.',
                lessons: [{ id: 'lesson-i1', title: '1. Cloud Models & Virtual Machines', duration: '30 min', objectives: ['Understand IaaS and Containers'], vocab: [{ word: 'IaaS', def: 'Infrastructure as a Service.' }], explanation: `Cloud architecture abstracts physical hardware into scalable, on-demand virtual resources.`, codeExample: `aws s3 ls s3://my-cloud-bucket`, activity: 'Review cloud pricing tiers.', quiz: [{ question: 'What provides ready software over web?', options: ['SaaS', 'IaaS', 'PaaS', 'Bare Metal'], answer: 0, explanation: 'SaaS delivers software applications.' }] }]
            },
            {
                id: 'course-j', code: 'Course J', title: 'Advanced Linux System Administration', category: 'Systems', level: 'Advanced', estimatedHours: 14, icon: 'fa-brands fa-linux', color: 'from-amber-600 to-yellow-700',
                description: 'Master Linux permissions (chmod/chown), process monitoring, kernel tuning, package managers, and system log auditing.',
                lessons: [{ id: 'lesson-j1', title: '1. Permissions & Process Control', duration: '35 min', objectives: ['Manage octal permissions and PIDs'], vocab: [{ word: 'chmod', def: 'Change file modes.' }], explanation: `System administrators manage Linux servers securely using advanced command-line utilities.`, codeExample: `chmod 755 script.sh && ps aux`, activity: 'Calculate octal permission flags.', quiz: [{ question: 'What does chmod 700 do?', options: ['Owner rwx', 'Public rwx', 'Read only', 'No access'], answer: 0, explanation: '7 gives owner read, write, execute.' }] }]
            },
            {
                id: 'course-k', code: 'Course K', title: 'Git Version Control & Collaboration', category: 'Software', level: 'Intermediate', estimatedHours: 8, icon: 'fa-brands fa-git-alt', color: 'from-orange-500 to-red-500',
                description: 'Master repositories, commits, branching workflows, pull requests, merge conflict resolution, and GitHub collaboration.',
                lessons: [{ id: 'lesson-k1', title: '1. Git Branching & Merging', duration: '30 min', objectives: ['Execute git commit and push workflows'], vocab: [{ word: 'Commit', def: 'Repository snapshot.' }], explanation: `Version control tracks codebase revisions collaboratively across distributed teams.`, codeExample: `git checkout -b feature/login && git push origin feature/login`, activity: 'Initialize a local git repository.', quiz: [{ question: 'What creates and switches branch?', options: ['git checkout -b', 'git init', 'git status', 'git pull'], answer: 0, explanation: '-b creates and switches branch.' }] }]
            },
            {
                id: 'course-l', code: 'Course L', title: 'IT Career Development & Certification Prep', category: 'Career', level: 'Advanced', estimatedHours: 6, icon: 'fa-solid fa-user-tie', color: 'from-emerald-600 to-teal-800',
                description: 'Prepare for professional IT certifications (CompTIA, AWS), build tech portfolios, craft ATS resumes, and ace technical interviews.',
                lessons: [{ id: 'lesson-l1', title: '1. Portfolios & Interview Readiness', duration: '30 min', objectives: ['Optimize resumes and GitHub profiles'], vocab: [{ word: 'ATS', def: 'Applicant Tracking System.' }], explanation: `Strategic career positioning bridges technical competence with recruiter expectations in the global IT industry.`, codeExample: `// Portfolio README template`, activity: 'Draft a professional technical elevator pitch.', quiz: [{ question: 'Why maintain a GitHub portfolio?', options: ['Verifiable proof of skills', 'Speed up internet', 'Replace interviews', 'Free hosting'], answer: 0, explanation: 'GitHub proves practical capability.' }] }]
            }
        ];

        let appState = {
            completedLessons: [],
            quizScores: {},
            completedProjects: [],
            xp: 150,
            streakDays: 1,
            currentActiveLessonId: 'lesson-a1'
        };

        function initStore() {
            const saved = localStorage.getItem('TECHMATE_PRO_STATE');
            if (saved) {
                try { appState = { ...appState, ...JSON.parse(saved) }; } catch(e){}
            }
            updateHeaderStats();
        }

        function saveStore() {
            localStorage.setItem('TECHMATE_PRO_STATE', JSON.stringify(appState));
            updateHeaderStats();
        }

        function updateHeaderStats() {
            document.getElementById('header-streak-count').innerText = appState.streakDays;
            document.getElementById('header-xp-count').innerText = appState.xp;
        }

        function navigateTo(viewId, param = null) {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const active = document.getElementById(`nav-${viewId}`);
            if (active) active.classList.add('active');

            const sidebar = document.getElementById('sidebar-nav');
            if (window.innerWidth < 768 && !sidebar.classList.contains('hidden')) {
                sidebar.classList.add('hidden');
            }

            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            switch(viewId) {
                case 'dashboard': renderDashboard(main); break;
                case 'courses': renderCourses(main); break;
                case 'my-learning': renderMyLearning(main); break;
                case 'lesson-view': renderLesson(main, param || appState.currentActiveLessonId); break;
                case 'quizzes': renderQuizzes(main); break;
                case 'projects': renderProjects(main); break;
                case 'progress': renderProgress(main); break;
                case 'inspiration': renderInspiration(main); break;
                case 'settings': renderSettings(main); break;
                case 'about': renderAbout(main); break;
                default: renderDashboard(main);
            }
        }

        function toggleMobileNav() {
            const s = document.getElementById('sidebar-nav');
            s.classList.toggle('hidden');
            s.classList.toggle('absolute');
            s.classList.toggle('z-50');
            s.classList.toggle('bg-navy-900');
        }

        function renderDashboard(container) {
            const totalL = COURSES_DATA.reduce((acc, c) => acc + c.lessons.length, 0);
            const doneL = appState.completedLessons.length;
            const pct = Math.round((doneL / totalL) * 100) || 0;

            container.innerHTML = `
                <div class="space-y-8 max-w-6xl mx-auto">
                    <div class="glass-card rounded-2xl p-8 relative overflow-hidden border border-cyan-500/30 bg-gradient-to-r from-navy-900 via-navy-800 to-navy-900 shadow-2xl">
                        <div class="relative z-10 space-y-4">
                            <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">
                                <i class="fa-solid fa-rocket mr-1"></i> Global IT Platform v2.5
                            </span>
                            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">Master Professional IT Skills</h1>
                            <p class="text-gray-400 text-sm sm:text-base max-w-2xl">Access complete industry curriculum from hardware fundamentals to cloud architecture and cybersecurity engineering.</p>
                            <div class="flex flex-wrap gap-4 pt-2">
                                <button onclick="navigateTo('lesson-view', '${appState.currentActiveLessonId}')" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 flex items-center gap-2 transition">
                                    <i class="fa-solid fa-play"></i> Continue Learning
                                </button>
                                <button onclick="navigateTo('courses')" class="px-6 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold text-sm border border-gray-700 transition">
                                    Explore Curriculum (A-L)
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="glass-card p-5 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase">Overall Progress</span>
                            <div class="text-3xl font-extrabold text-cyan-400 mt-1">${pct}%</div>
                            <div class="w-full bg-gray-800 h-2 rounded-full mt-3 overflow-hidden">
                                <div class="bg-cyan-400 h-full" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <div class="glass-card p-5 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase">Lessons Completed</span>
                            <div class="text-3xl font-extrabold text-emerald-400 mt-1">${doneL} / ${totalL}</div>
                            <span class="text-xs text-gray-500 mt-2 block">Verified modules</span>
                        </div>
                        <div class="glass-card p-5 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase">Learning Streak</span>
                            <div class="text-3xl font-extrabold text-amber-400 mt-1">${appState.streakDays} Days</div>
                            <span class="text-xs text-gray-500 mt-2 block">Active engagement</span>
                        </div>
                        <div class="glass-card p-5 rounded-xl">
                            <span class="text-xs font-semibold text-gray-400 uppercase">Total XP</span>
                            <div class="text-3xl font-extrabold text-violet-400 mt-1">${appState.xp} XP</div>
                            <span class="text-xs text-gray-500 mt-2 block">Expertise score</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-bold text-white">Curriculum Courses (A - L)</h2>
                            <button onclick="navigateTo('courses')" class="text-xs font-semibold text-cyan-400 hover:underline">View All &rarr;</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            ${COURSES_DATA.map(c => renderCourseCard(c)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCourseCard(course) {
            let doneCount = course.lessons.filter(l => appState.completedLessons.includes(l.id)).length;
            let pct = Math.round((doneCount / course.lessons.length) * 100);
            return `
                <div class="glass-card glass-card-hover rounded-2xl p-6 flex flex-col justify-between space-y-4">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-navy-800 text-cyan-400 border border-gray-700">${course.code}</span>
                            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-800 text-gray-300">${course.level}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${course.color} flex items-center justify-center text-white text-xl shadow-md">
                                <i class="${course.icon}"></i>
                            </div>
                            <h3 class="font-bold text-base text-white leading-snug">${course.title}</h3>
                        </div>
                        <p class="text-xs text-gray-400 line-clamp-2">${course.description}</p>
                    </div>
                    <div class="space-y-3 pt-3 border-t border-gray-800">
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${course.estimatedHours} Hours</span>
                            <span>${doneCount}/${course.lessons.length} Lessons</span>
                        </div>
                        <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r ${course.color} h-full" style="width: ${pct}%"></div>
                        </div>
                        <button onclick="navigateTo('lesson-view', '${course.lessons[0].id}')" class="w-full py-2.5 rounded-xl bg-gray-800 hover:bg-cyan-600 text-cyan-400 hover:text-white text-xs font-bold transition border border-gray-700">
                            Start Course Module
                        </button>
                    </div>
                </div>
            `;
        }

        function renderCourses(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Complete IT Curriculum (Course A to L)</h1>
                        <p class="text-sm text-gray-400">Structured professional learning paths designed for IT mastery.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${COURSES_DATA.map(c => renderCourseCard(c)).join('')}
                    </div>
                </div>
            `;
        }

        function renderMyLearning(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-white">My Learning Studio</h1>
                        <p class="text-sm text-gray-400">Track active courses and continue from your latest milestone.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${COURSES_DATA.slice(0, 4).map(c => renderCourseCard(c)).join('')}
                    </div>
                </div>
            `;
        }

        function renderLesson(container, lessonId) {
            appState.currentActiveLessonId = lessonId;
            saveStore();
            let currentC = COURSES_DATA.find(c => c.lessons.some(l => l.id === lessonId)) || COURSES_DATA[0];
            let currentL = currentC.lessons.find(l => l.id === lessonId) || currentC.lessons[0];
            let isDone = appState.completedLessons.includes(currentL.id);

            container.innerHTML = `
                <div class="space-y-6 max-w-4xl mx-auto pb-12">
                    <div class="flex items-center justify-between text-xs text-gray-400 border-b border-gray-800 pb-4">
                        <button onclick="navigateTo('courses')" class="hover:text-cyan-400 flex items-center gap-1">
                            <i class="fa-solid fa-arrow-left"></i> Back to Curriculum
                        </button>
                        <span class="px-2.5 py-1 rounded bg-navy-800 text-cyan-400 font-bold border border-gray-800">${currentC.code}</span>
                    </div>

                    <div class="space-y-2">
                        <span class="text-xs px-2.5 py-1 rounded bg-cyan-500/10 text-cyan-400 font-semibold border border-cyan-500/20">${currentC.level}</span>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-white">${currentL.title}</h1>
                    </div>

                    <div class="glass-card p-6 rounded-2xl border-l-4 border-l-cyan-400 space-y-3">
                        <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-bullseye mr-2"></i> Learning Objectives</h3>
                        <ul class="space-y-1 text-sm text-gray-300">
                            ${currentL.objectives.map(o => `<li>• ${o}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="space-y-3 text-sm sm:text-base text-gray-300 leading-relaxed">
                        <h3 class="text-base font-bold text-white"><i class="fa-solid fa-book-open text-violet-400 mr-2"></i> Comprehensive Explanation</h3>
                        <p>${currentL.explanation}</p>
                    </div>

                    ${currentL.codeExample ? `
                        <div class="space-y-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400"><i class="fa-solid fa-code text-emerald-400 mr-1"></i> Code & System Reference</h3>
                            <pre class="bg-navy-950 p-4 rounded-xl text-xs sm:text-sm text-cyan-300 border border-gray-800 overflow-x-auto"><code>${currentL.codeExample}</code></pre>
                        </div>
                    ` : ''}

                    <div class="glass-card p-6 rounded-2xl space-y-4">
                        <h3 class="text-base font-bold text-white"><i class="fa-solid fa-list-check text-amber-400 mr-2"></i> Knowledge Verification Quiz</h3>
                        <p class="text-sm text-gray-200 font-semibold">${currentL.quiz[0].question}</p>
                        <div class="space-y-2">
                            ${currentL.quiz[0].options.map((opt, idx) => `
                                <button onclick="alert(${idx === currentL.quiz[0].answer} ? 'Correct Answer! (+25 XP)' : 'Incorrect. Try again.')" class="w-full text-left p-3 rounded-xl bg-navy-900 hover:bg-gray-800 border border-gray-800 text-xs sm:text-sm text-gray-300 transition">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="toggleComplete('${currentL.id}')" class="px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition ${isDone ? 'bg-emerald-500 text-white' : 'bg-cyan-500 hover:bg-cyan-400 text-white shadow-lg shadow-cyan-500/20'}">
                        ${isDone ? '<i class="fa-solid fa-check mr-1"></i> Completed (+50 XP)' : 'Mark Lesson Complete'}
                    </button>
                </div>
            `;
        }

        function toggleComplete(id) {
            if(!appState.completedLessons.includes(id)) {
                appState.completedLessons.push(id);
                appState.xp += 50;
                saveStore();
            }
            navigateTo('lesson-view', id);
        }

        function renderQuizzes(container) {
            container.innerHTML = `<div class="space-y-6 max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Global Quizzes & Assessments</h1><p class="text-sm text-gray-400">Test your expertise across all IT modules.</p></div>`;
        }
        function renderProjects(container) {
            container.innerHTML = `<div class="space-y-6 max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Hands-on Practical Labs</h1><p class="text-sm text-gray-400">Build real-world projects for your professional portfolio.</p></div>`;
        }
        function renderProgress(container) {
            container.innerHTML = `<div class="space-y-6 max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Badges & Analytics</h1><p class="text-sm text-gray-400">Your achievement metrics and learning progression stats.</p></div>`;
        }
        function renderInspiration(container) {
            container.innerHTML = `<div class="space-y-6 max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Expert Tips & Best Practices</h1><p class="text-sm text-gray-400">Guidance from industry leaders to accelerate your tech career.</p></div>`;
        }
        function renderSettings(container) {
            container.innerHTML = `<div class="space-y-6 max-w-3xl mx-auto"><h1 class="text-2xl font-bold text-white">Platform Settings</h1><p class="text-sm text-gray-400">Customize appearance and study goals.</p></div>`;
        }
        function renderAbout(container) {
            container.innerHTML = `<div class="space-y-6 max-w-3xl mx-auto glass-card p-8 rounded-2xl text-center"><h1 class="text-2xl font-extrabold text-white">TechMate Academy Pro</h1><p class="text-sm text-gray-300">Global IT Learning Platform v2.5. Built for professional excellence.</p></div>`;
        }

        window.onload = () => {
            initStore();
            navigateTo('dashboard');
        };
    </script>
</body>
</html>
